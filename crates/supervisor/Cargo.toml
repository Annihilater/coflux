[package]
name = "coflux-supervisor"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "coflux-supervisor"
path = "src/main.rs"

[dependencies]
coflux-protocol = { path = "../protocol" }
# PTY 归 coflux-ptyd（plan 20260918-ptyd-terminal-custody）：supervisor 只是它的客户端，不再依赖 portable-pty，
# 手里没有任何 PTY 描述符。单测经同一个 crate 在进程内起真 ptyd。supervisor 永不启动 ptyd。
coflux-ptyd = { path = "../ptyd" }
serde.workspace = true
serde_json.workspace = true
signal-hook = "0.3"
libc = "0.2"
ureq = "2"
sha2 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
semver = "1"
vt100 = "0.16.2"
